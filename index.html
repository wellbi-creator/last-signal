<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!--
      Мобильные браузеры (iPhone Safari):
      - viewport-fit=cover: игра заходит под «чёлку»; отступы safe-area обработает UI (этап M2+).
      - user-scalable=no и touch-action: none: нет зума и прокрутки страницы во время игры.
        iOS Safari игнорирует user-scalable, поэтому жесты дополнительно гасятся в src/platform.ts.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0f12" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Последний сигнал" />
    <meta name="format-detection" content="telephone=no" />
    <title>Последний сигнал</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b0f12;
        color: #8a949c;
        font-family: system-ui, sans-serif;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100vh; /* запасной вариант для старых браузеров */
        height: 100dvh; /* учитывает адресную строку мобильных браузеров */
      }
      #game canvas {
        display: block;
        touch-action: none;
      }
      #boot-message {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
      }
    </style>
  </head>
  <body>
    <div id="game">
      <div id="boot-message">Загрузка…</div>
    </div>
    <noscript>Для игры нужен включённый JavaScript.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
